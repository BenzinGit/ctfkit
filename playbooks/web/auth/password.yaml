name: web.auth.password

steps:

  - id: find_usernames
    title: Find Possible Usernames

    info: |
      Identify likely usernames before attacking login.

    checklist:
      - Try common usernames (admin, administrator)
      - Look for email patterns (firstname.lastname)
      - Check public profiles or responses
      - Look for leaked emails in HTTP responses

    payloads:
      - admin
      - administrator
      - user


  - id: http_basic_auth
    title: Authentication (HTTP Basic)

    info: |
      Base64-encoded credentials sent in Authorization header.

    checklist:
      - Check for Authorization header
      - Identify "Basic" scheme
      - Decode Base64 values
      - Attempt brute force

    commands:
      - Decode Base64(username:password)
      - Test credentials manually


  - id: enum_username_response
    title: Username Enumeration (Response Differences)

    info: |
      Identify valid usernames by differences in login responses.

    checklist:
      - Compare invalid username vs incorrect password responses
      - Look for differences in response length
      - Use Grep Extract for subtle differences
      - Look for typos or whitespace changes

    commands:
      - Send login request to Burp Intruder
      - Fuzz username with wordlist
      - Sort/filter responses


  - id: enum_username_timing
    title: Username Enumeration (Timing)

    info: |
      Identify valid usernames using response time differences.

    checklist:
      - Use long password (~100 chars)
      - Compare response times
      - Repeat to confirm consistency

    commands:
      - Send request to Burp Repeater
      - Test long password
      - Use Intruder with timing columns


  - id: enum_username_lock
    title: Username Enumeration (Account Lock)

    info: |
      Account lock messages can reveal valid usernames.

    checklist:
      - Trigger account lock intentionally
      - Look for "too many attempts" message
      - Compare response differences

    commands:
      - Repeat login attempts per username
      - Observe response changes


  - id: brute_force_password
    title: Password Brute Force

    info: |
      Once a valid username is found, brute-force the password.

    checklist:
      - Use password wordlist
      - Identify success indicators:
        - 302 redirect
        - Response length change
        - Session cookie issued

    commands:
      - Fuzz password parameter
      - Filter responses (status code / length)


  - id: distributed_bruteforce
    title: Brute Force (Distributed)

    info: |
      Try few passwords across many users to avoid lockouts.

    checklist:
      - Limit attempts per account
      - Try common passwords across all users
      - Look for any successful login

    commands:
      - Use Cluster Bomb attack
      - Small password list + large username list


  - id: credential_stuffing
    title: Credential Stuffing

    info: |
      Use known leaked credentials.

    checklist:
      - Use username:password pairs
      - Test each only once
      - Look for successful login

    commands:
      - Load combo list in Burp Intruder


  - id: bypass_rate_limit
    title: Rate Limit Bypass

    info: |
      Avoid IP-based blocking during brute-force.

    checklist:
      - Check if X-Forwarded-For is respected
      - Rotate IP values
      - Observe blocking behavior

    commands:
      - "Add header: X-Forwarded-For: 1.1.1.1"


  - id: bypass_bruteforce_logic
    title: Brute-Force Bypass (Logic Flaw)

    info: |
      Some systems reset failed attempts after a successful login.

    checklist:
      - Check if counter resets after login
      - Alternate your login with target attempts

    commands:
      - Use Burp Intruder (Pitchfork)
      - Alternate usernames (you + victim)
