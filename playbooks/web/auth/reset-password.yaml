name: web.auth.reset

steps:

  - id: detect_reset
    title: Identify Password Reset Functionality

    checklist:
      - Locate "Forgot password"
      - Submit reset request
      - Inspect reset flow

    commands:
      - Capture reset request in Burp


  - id: test_user_param
    title: Test User Parameter in Reset URL

    info: |
      Check if reset is based on predictable parameters.

    checklist:
      - Look for ?user= or similar
      - Modify username
      - Attempt reset for another user

    commands:
      - Modify reset URL parameter


  - id: analyze_token
    title: Analyze Reset Token

    checklist:
      - Check token length/entropy
      - Look for predictable patterns
      - Try reuse of token

    commands:
      - Inspect token in reset URL


  - id: skip_token_validation
    title: Test Missing Token Validation

    info: |
      Check if token is validated on submission.

    checklist:
      - Submit reset request
      - Remove token from request
      - Modify username
      - Check if reset still works

    commands:
      - Send reset POST to Burp Repeater
      - Remove token parameter


  - id: reset_other_user
    title: Reset Another User's Password

    checklist:
      - Change username in request
      - Set new password
      - Verify login as victim

    commands:
      - Modify POST body (username field)


  - id: reuse_token
    title: Test Token Reuse

    checklist:
      - Use same token multiple times
      - Check if token expires
      - Attempt replay attack

    commands:
      - Replay reset request


  - id: check_token_binding
    title: Check Token-User Binding

    checklist:
      - Generate token for your account
      - Replace username in request
      - Check if token works for another user

    commands:
      - Modify username in reset POST
