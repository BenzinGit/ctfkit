name: web.auth.change

steps:

  - id: access_change
    title: Access Password Change Functionality

    checklist:
      - Log in as normal user
      - Locate change password page
      - Capture request

    commands:
      - Intercept POST /change-password


  - id: analyze_request
    title: Analyze Request Structure

    checklist:
      - Check for username field
      - Identify current-password parameter
      - Identify new-password fields

    commands:
      - Inspect request in Burp


  - id: test_username_control
    title: Test Username Manipulation

    info: |
      Check if username can be modified.

    checklist:
      - Change username to another user
      - Replay request
      - Observe response

    commands:
      - Modify username parameter


  - id: enum_password_via_response
    title: Enumerate Password via Response Differences

    info: |
      Use error messages to identify valid passwords.

    checklist:
      - Send incorrect current password
      - Compare responses
      - Look for unique success indicators

    commands:
      - Send request to Burp Intruder
      - Fuzz current-password


  - id: exploit_mismatch_logic
    title: Exploit Password Mismatch Logic

    info: |
      Use mismatched new passwords to detect valid current password.

    checklist:
      - Set new-password-1 ≠ new-password-2
      - Observe different response
      - Identify correct password

    commands:
      - username=victim&current-password=FUZZ&new-password-1=a&new-password-2=b


  - id: brute_force_password
    title: Brute Force via Change Password

    checklist:
      - Use password wordlist
      - Look for unique response (e.g. "passwords do not match")
      - Identify valid password

    commands:
      - Burp Intruder (Sniper)
      - Grep match success string


  - id: login_as_victim
    title: Authenticate as Victim

    checklist:
      - Use discovered credentials
      - Log in to account
      - Confirm access

    commands:
      - Manual login
